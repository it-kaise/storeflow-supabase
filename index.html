// โหลดข้อมูล Master Data
async function loadMasterData() {
    try {
        const { data, error } = await sb.from('sf_master').select('*').eq('id', 'main').single();
        if (error) {
            console.error('Error loading master:', error);
            return INIT_MASTER;
        }
        return {
            matTypes: data.mat_types || INIT_MASTER.matTypes,
            partNames: data.part_names || INIT_MASTER.partNames,
            makers: data.makers || INIT_MASTER.makers,
            customers: data.customers || INIT_MASTER.customers,
            departments: data.departments || INIT_MASTER.departments,
            units: data.units || INIT_MASTER.units
        };
    } catch (e) {
        console.error('Error loading master:', e);
        return INIT_MASTER;
    }
}

// บันทึก Master Data
async function saveMasterData(master) {
    try {
        const { error } = await sb.from('sf_master').update({
            mat_types: master.matTypes,
            part_names: master.partNames,
            makers: master.makers,
            customers: master.customers,
            departments: master.departments,
            units: master.units,
            updated_at: new Date().toISOString()
        }).eq('id', 'main');
        if (error) throw error;
        return true;
    } catch (e) {
        console.error('Error saving master:', e);
        return false;
    }
}

// โหลด Lots (แยกตาม material_id)
async function loadLots() {
    try {
        const { data, error } = await sb.from('sf_lots').select('*').order('lot_date', { ascending: true });
        if (error) throw error;
        
        // ตรวจว่าตารางมีคอลัมน์หน่วยเมตรแล้วหรือยัง (เพิ่มภายหลังได้โดยไม่ต้องแก้โค้ด)
        if (data.length) LOTS_HAS_M = Object.prototype.hasOwnProperty.call(data[0], 'rem_m');
        const grouped = {};
        data.forEach(lot => {
            if (!grouped[lot.material_id]) grouped[lot.material_id] = [];
            grouped[lot.material_id].push({
                lotNo: lot.lot_no,
                date: lot.lot_date,
                po: lot.po,
                maker: lot.maker,
                pcs: lot.pcs,
                coil: lot.coil,
                kgs: lot.kgs,
                m: lot.m != null ? lot.m : null,
                rem_kgs: lot.rem_kgs,
                rem_pcs: lot.rem_pcs,
                rem_coil: lot.rem_coil,
                rem_m: lot.rem_m != null ? lot.rem_m : null,
                rohs: lot.rohs,
                _dbId: lot.id
            });
        });
        return grouped;
    } catch (e) {
        console.error('Error loading lots:', e);
        return {};
    }
}

// บันทึก Lot ใหม่
async function saveLot(materialId, lot) {
    try {
        const payload = {
            material_id: materialId,
            lot_no: lot.lotNo,
            lot_date: lot.date,
            po: lot.po || null,
            maker: lot.maker,
            pcs: lot.pcs,
            coil: lot.coil,
            kgs: lot.kgs,
            rem_kgs: lot.rem_kgs,
            rem_pcs: lot.rem_pcs,
            rem_coil: lot.rem_coil,
            rohs: lot.rohs || 'ROHS'
        };
        // ส่งหน่วยเมตรเฉพาะเมื่อตารางมีคอลัมน์แล้ว (กัน error ถ้ายังไม่ได้เพิ่ม)
        if (LOTS_HAS_M) { payload.m = lot.m != null ? lot.m : null; payload.rem_m = lot.rem_m != null ? lot.rem_m : null; }
        const { error } = await sb.from('sf_lots').insert(payload);
        if (error) throw error;
        return true;
    } catch (e) {
        console.error('Error saving lot:', e);
        return false;
    }
}

// จัดรูปแบบตัวเลขให้มี comma คั่นหลักพัน (เช่น 2196 -> 2,196 ; 719.8 -> 719.8)
// ── ราคาต่อ lot: เก็บเป็น { p: ราคา, u: "kgs"|"pcs"|"coil" }
//    (ข้อมูลเก่าเก็บเป็นตัวเลขล้วน u=null = ให้ระบบเดาหน่วยเอง) ──
const PRICE_UNITS = [{ v: "kgs", l: "฿/KGS" }, { v: "pcs", l: "฿/PCS" }, { v: "coil", l: "฿/COIL" }, { v: "m", l: "฿/M (เมตร)" }];
function priceUnitLabel(u) { return u === "coil" ? "COIL" : u === "pcs" ? "PCS" : u === "m" ? "M" : "KGS"; }
// หน่วยราคาเริ่มต้น = หน่วยที่ lot นั้นมีของจริง (กัน default ผิดหน่วยแล้วมูลค่าเป็น 0)
function autoPriceUnit(kgs, pcs, coil, m) {
    // ของ KU NOMURA รับเป็นเมตร ราคาก็คิดเป็นบาท/เมตร → ต้องเดาหน่วย M ก่อน
    if ((parseFloat(m) || 0) > 0) return "m";
    if ((parseFloat(kgs) || 0) > 0) return "kgs";
    if ((parseFloat(pcs) || 0) > 0) return "pcs";
    if ((parseFloat(coil) || 0) > 0) return "coil";
    return "kgs";
}
// ── หน่วยที่ "เกี่ยวข้องจริง" ของวัตถุดิบแต่ละชนิด (ใช้ซ่อนคอลัมน์ที่ไม่ได้ใช้) ──
//    CU (ทองแดง)  → COIL / KGS / PCS
//    ST/SUS/AL/BRASS/JFE → KGS / PCS (ไม่มี COIL, ไม่มี M)
//    PART ASSY    → KGS / PCS / M (M ใช้เฉพาะ maker KU NOMURA)
function unitsForMat(m) {
    const t = String((m && m.type) || "").toUpperCase();
    const u = String((m && m.unit) || "").toUpperCase();
    const mk = String((m && m.maker) || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const r = { kgs: true, pcs: true, coil: false, m: false };
    if (t === "CU") r.coil = true;
    if (/PART|ASSY/.test(t) && (mk.indexOf("KUNOMURA") >= 0 || u === "M")) r.m = true;
    // เคารพหน่วยที่ตั้งไว้ที่ตัว material เอง (เผื่อมีเคสพิเศษนอกกฎด้านบน)
    if (u.indexOf("COIL") >= 0) r.coil = true;
    if (u === "M") r.m = true;
    return r;
}
function lotPriceOf(map, matId, lotNo) {
    const x = (map || {})[matId + "||" + lotNo];
    if (x == null) return null;
    if (typeof x === "number") return { p: x, u: null };
    if (typeof x === "object" && x.p != null) return { p: x.p, u: x.u || null };
    return null;
}
// แสดงวันที่แบบไทย วัน/เดือน/ปี (เก็บในฐานข้อมูลเป็น yyyy-mm-dd เหมือนเดิม)
function fmtDate(d) {
    if (!d) return "-";
    const s = String(d).trim();
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return s;
    return m[3] + "/" + m[2] + "/" + m[1];
}
function fmtQty(n, dec) {
    if (n == null || n === "-" || n === "") return n;
    const v = Number(n);
    if (!isFinite(v)) return n;
    return dec != null
        ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })
        : v.toLocaleString('en-US');
}

// อัพเดท Lot
async function updateLot(dbId, updates) {
    try {
        // ตัดฟิลด์หน่วยเมตรออกถ้าตารางยังไม่มีคอลัมน์ (กัน error ทั้งคำสั่ง)
        if (!LOTS_HAS_M && updates && (("m" in updates) || ("rem_m" in updates))) {
            updates = { ...updates };
            delete updates.m; delete updates.rem_m;
        }
        const { error } = await sb.from('sf_lots').update(updates).eq('id', dbId);
        if (error) throw error;
        return true;
    } catch (e) {
        console.error('Error updating lot:', e);
        return false;
    }
}

function saveLocalBackup(data) {
    try {
        const json = JSON.stringify(data);
        if (json.length > 4500000) return { ok: false, why: "ข้อมูลใหญ่เกินกว่าจะเก็บในเครื่อง" };
        const slots = [1, 2, 3];
        for (let i = slots.length - 1; i > 0; i--) {
            const prev = localStorage.getItem("sf_bk_" + slots[i - 1]);
            if (prev != null) localStorage.setItem("sf_bk_" + slots[i], prev);
        }
        localStorage.setItem("sf_bk_1", json);
        localStorage.setItem("sf_bk_at", data.exportedAt);
        return { ok: true };
    } catch (e) { return { ok: false, why: e.message }; }
}
function listLocalBackups() {
    const out = [];
    [1, 2, 3].forEach(i => {
        try {
            const s = localStorage.getItem("sf_bk_" + i);
            if (!s) return;
            const d = JSON.parse(s);
            out.push({ slot: i, at: d.exportedAt || "", size: s.length,

                    iss: (d.issueHist || []).length, rcv: (d.recvHist || []).length } });

// เพราะคอลัมน์ status มี CHECK constraint ที่ไม่รับค่า "revised"
function isSupersededReq(req, allRequests) {
    if (!req || !req.id) return false;
    return (allRequests || []).some(r => r.revisedFrom === req.id && r.status !== "rejected" && r.status !== "revised");

// ── ฟังก์ชันกลางสำหรับสถานะคืน/เคลม NG (ใช้ร่วมกันหลายที่ ให้ผลตรงกันเสมอ) ──
function ngUnits(r) { return ["kgs", "coil", "pcs", "m"].filter(u => (r[u] || 0) > 0); }
function ngReps(r) { return (r.replacements && r.replacements.length) ? r.replacements : (r.replaceLotNo ? [{ lotNo: r.replaceLotNo, kgs: r.kgs, pcs: r.pcs, coil: r.coil, m: r.m, date: r.replaceDate, by: r.replaceBy }] : []); }
function ngReceived(r) { const s = { kgs: 0, pcs: 0, coil: 0, m: 0 }; ngReps(r).forEach(x => { s.kgs += parseFloat(x.kgs) || 0; s.pcs += parseFloat(x.pcs) || 0; s.coil += parseFloat(x.coil) || 0; s.m += parseFloat(x.m) || 0; }); return s; }
function ngStatus(r) { const u = ngUnits(r), rc = ngReceived(r); if (u.every(k => rc[k] <= 0.001)) return "open"; return u.every(k => rc[k] >= (r[k] || 0) - 0.05) ? "replaced" : "partial"; }

// SORT FUNCTION - เรียง Size จากเล็กไปใหญ่
// ══════════════════════════════════════════════════════════
function sortBySize(materials) {
    return [...materials].sort((a, b) => {
        // แยก size ออกเป็นตัวเลข
        const parseSize = (sizeStr) => {
            if (!sizeStr) return [0, 0, 0];
            // ลบข้อความที่ไม่ใช่ตัวเลข เช่น LWC, mm, Ø
            // ตัดลูกน้ำคั่นหลักพันก่อน (เช่น 4,000 -> 4000) ไม่งั้นจะอ่านความยาวเป็น 4
            const cleaned = sizeStr.toUpperCase().replace(/(\d),(?=\d)/g, '$1').replace(/[^0-9.×xX]/g, ' ').replace(/Ø/g, '');
            const nums = cleaned.split(/[×xX\s]+/).map(n => parseFloat(n) || 0).filter(n => n > 0);
            return [nums[0] || 0, nums[1] || 0, nums[2] || 0]; // [OD, THK, LENGTH]
        };
        
        const sizeA = parseSize(a.size);
        const sizeB = parseSize(b.size);
        
        // เปรียบเทียบ OD, THK, LENGTH ตามลำดับ
        for (let i = 0; i < 3; i++) {
            if (sizeA[i] !== sizeB[i]) {
                return sizeA[i] - sizeB[i];
            }
        }
        
        // ถ้าตัวเลขเท่ากันหมด → เรียงต่อด้วย size (ข้อความ) → ชื่อ → maker → temper
        // (ต้องมี tiebreaker ครบ ไม่งั้นคู่ที่ size เดียวกันต่างแค่ temper จะสลับตำแหน่งไปมา)
        const bySize = (a.size || '').localeCompare(b.size || '');
        if (bySize !== 0) return bySize;
        const byName = (a.name || '').localeCompare(b.name || '');
        if (byName !== 0) return byName;
        const byMaker = (a.maker || '').localeCompare(b.maker || '');
        if (byMaker !== 0) return byMaker;
        return (a.temper || '').localeCompare(b.temper || '');
    });
}

// ฟังก์ชันหา Material ที่มี Size เดียวกัน
function getMaterialsWithSameSize(materials, material) {
    if (!material || !material.size || !material.type) return [];
    return materials.filter(m => 
        m.id !== material.id &&
        m.type === material.type && 
        m.size.toLowerCase() === material.size.toLowerCase() &&
        m.active !== false
    );
}

// hash ชื่อ -> ตัวเลขคงที่ (สำหรับเลือกสีให้คงที่ต่อ maker)
function _strHash(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return Math.abs(h);
}

// ทะเบียนสีของแต่ละ maker — กำหนดจากรายชื่อ maker ทั้งหมดเรียงตามตัวอักษร
// เพื่อให้แต่ละ maker ได้คนละสี (ไม่ชนกัน) จนกว่าจะเกินจำนวนสีในจาน
let MAKER_COLOR_MAP = {};
function buildMakerColorMap(makerNames) {
    const uniq = [...new Set((makerNames || []).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b)));
    const map = {};
    uniq.forEach((name, i) => { map[name] = MAKER_COLORS[i % MAKER_COLORS.length]; });
    MAKER_COLOR_MAP = map;
    return map;
}

// ฟังก์ชันกำหนดสีตาม Maker — คงที่ต่อชื่อ maker เสมอ (ทุกหน้าได้สีเดียวกัน)
function getMakerColor(materials, material) {
    if (!material || !material.maker) return MAKER_DEFAULT_COLOR;
    if (MAKER_COLOR_MAP[material.maker]) return MAKER_COLOR_MAP[material.maker];
    // maker ที่ยังไม่อยู่ในทะเบียน (เช่นเพิ่งเพิ่มใหม่) → ใช้ hash ของชื่อชั่วคราว
    return MAKER_COLORS[_strHash(material.maker) % MAKER_COLORS.length];
}

// ฟังก์ชันกำหนดสีตาม Temper
function getTemperColor(materials, material) {
    const sameSizeSameMaker = materials.filter(m =>
        m.id !== material.id &&
        m.type === material.type &&
        m.size.toLowerCase() === material.size.toLowerCase() &&
        m.maker === material.maker &&
        m.active !== false
    );
    
    if (sameSizeSameMaker.length === 0) return TEMPER_COLORS[0];
    
    // เรียงตาม Temper
    const allTempers = [material, ...sameSizeSameMaker].map(m => m.temper || '-').sort();
    const uniqueTempers = [...new Set(allTempers)];
    
    if (uniqueTempers.length === 1) return TEMPER_COLORS[0];
    
    const temperIndex = uniqueTempers.indexOf(material.temper || '-');
    return TEMPER_COLORS[(temperIndex % (TEMPER_COLORS.length - 1)) + 1];
}

// สีของแถบซ้ายแต่ละแถว = สี Maker (คงที่ต่อ maker) | การแยก temper ไปแสดงที่ช่อง Temper
function getMaterialColor(materials, material) {
    return getMakerColor(materials, material);
}

function exportXLSX(sheets, filename) {
    // sheets = [{name, headers, rows}]
    try {
        const XLSX = window.XLSX;
        if (!XLSX) {
            alert("กำลังโหลด SheetJS... กรุณาลองใหม่อีกครั้ง");
            return;
        }
        const wb = XLSX.utils.book_new();
        sheets.forEach(({ name, headers, rows }) => {
            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows.map(r => r.map(c => c === null || c === undefined ? "" : c))]);
            // ปรับความกว้างคอลัมน์อัตโนมัติ
            const colWidths = headers.map((h, hi) => {
                const maxLen = Math.max(h.length, ...rows.map(r => String(r[hi] || "").length));
                return { wch: Math.min(Math.max(maxLen + 2, 8), 40) };
            });
            ws["!cols"] = colWidths;
            XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
        });
        XLSX.writeFile(wb, filename);
    }
    catch (e) {
        alert("Export ไม่สำเร็จ: " + e.message);
    }
}

    async function receiveReplacementStock(rec, rep) {
        if (!rec.matId) { toast("⚠️ ไม่พบ material ในคลังสำหรับ lot ทดแทนนี้", "warn"); return; }
        const newLot = { lotNo: rep.lotNo, date: rep.date, po: "", maker: rec.maker,
            pcs: rep.pcs || null, coil: rep.coil || null, kgs: rep.kgs || null, m: rep.m || null,
            rem_kgs: rep.kgs || null, rem_pcs: rep.pcs || null, rem_coil: rep.coil || null, rem_m: rep.m || null, rohs: "ROHS" };
        await saveLot(rec.matId, newLot);
        setLots(ls => ({ ...ls, [rec.matId]: [...(ls[rec.matId] || []), newLot] }));
        const invNote = "ทดแทน NG (lot เดิม " + rec.lotNo + ")";
        const repTemper = (rec.temper && rec.temper !== "-") ? rec.temper : "";
        const repPayload = { receive_date: rep.date, po: null, inv: invNote, material_name: rec.name + " " + rec.size, maker: rec.maker, lot_no: rep.lotNo, pcs: newLot.pcs, coil: newLot.coil, kgs: newLot.kgs, rohs: "ROHS" };
        if (RECVHIST_HAS_TEMPER) repPayload.temper = repTemper || null;
        if (RECVHIST_HAS_M) repPayload.m = newLot.m || null;
        await sb.from('sf_recvhist').insert(repPayload);
        setRecvHist(h => [{ date: rep.date, po: "", inv: invNote, name: rec.name + " " + rec.size, temper: repTemper, maker: rec.maker, lotNo: rep.lotNo, pcs: newLot.pcs, coil: newLot.coil, kgs: newLot.kgs, m: newLot.m, rohs: "ROHS" }, ...h]);
        logAudit("NG", "รับงานทดแทน", `${rec.name} ${(rec.size || "").replace(/^size:/i, "")} · lot ทดแทน ${rep.lotNo} (${[rep.kgs ? rep.kgs + "K" : null, rep.coil ? rep.coil + "C" : null, rep.pcs ? rep.pcs + "PCS" : null, rep.m ? rep.m + "M" : null].filter(Boolean).join("/")}) · เคลม lot เดิม ${rec.lotNo}`);
        toast(`📥 รับงานทดแทน lot ${rep.lotNo} เข้าสต๊อกแล้ว`);

    // ── แก้ไขงานทดแทน (จากหน้าเคลม NG) → ซิงค์ไปสต๊อก + ประวัติรับ ──
    async function editReplacementStock(rec, idx, newRep) {
        const reps = ngReps(rec);
        const oldRep = reps[idx];
        if (!oldRep) return;
        const oldLot = oldRep.lotNo, newLot2 = (newRep.lotNo || "").trim() || oldLot;
        // 1) อัปเดตในประวัติ NG + สถานะ
        const newReps = reps.map((x, i) => i === idx ? { ...x, ...newRep, lotNo: newLot2 } : x);
        const upNg = ngReturns.map(r => { if (r.id !== rec.id) return r; const nr = { ...r, replacements: newReps, replaceLotNo: undefined, replaceDate: undefined, replaceBy: undefined }; nr.status = ngStatus(nr); return nr; });
        await saveNgReturns(upNg);
        // 2) อัปเดต lot ในสต๊อก (จับด้วยเลข lot เดิม)
        if (rec.matId) {
            const cur = (lots[rec.matId] || []).find(l => l.lotNo === oldLot);
            if (cur) {
                const upd = { lotNo: newLot2, kgs: newRep.kgs || null, pcs: newRep.pcs || null, coil: newRep.coil || null, rem_kgs: newRep.kgs || null, rem_pcs: newRep.pcs || null, rem_coil: newRep.coil || null, date: newRep.date || cur.date };
                setLots(ls => ({ ...ls, [rec.matId]: (ls[rec.matId] || []).map(l => (l.lotNo === oldLot && l._dbId === cur._dbId) ? { ...l, ...upd } : l) }));
                if (cur._dbId) await updateLot(cur._dbId, { lot_no: upd.lotNo, lot_date: upd.date, kgs: upd.kgs, pcs: upd.pcs, coil: upd.coil, rem_kgs: upd.rem_kgs, rem_pcs: upd.rem_pcs, rem_coil: upd.rem_coil });
            }
        }
        // 3) อัปเดตประวัติรับ (แถวที่เป็นงานทดแทนของ lot เดิม)
        setRecvHist(h => h.map(x => x.lotNo === oldLot ? { ...x, lotNo: newLot2, kgs: newRep.kgs || null, pcs: newRep.pcs || null, coil: newRep.coil || null, date: newRep.date || x.date } : x));
        await sb.from('sf_recvhist').update({ lot_no: newLot2, kgs: newRep.kgs || null, pcs: newRep.pcs || null, coil: newRep.coil || null, receive_date: newRep.date || oldRep.date }).eq('lot_no', oldLot);
        logAudit("NG", "แก้งานทดแทน", `${rec.name} · lot ${oldLot}${newLot2 !== oldLot ? " → " + newLot2 : ""} · จำนวน ${[newRep.kgs ? newRep.kgs + "K" : null, newRep.coil ? newRep.coil + "C" : null, newRep.pcs ? newRep.pcs + "PCS" : null].filter(Boolean).join("/")}`);
        toast("💾 แก้ไขงานทดแทนแล้ว — ซิงค์ คลัง/ประวัติรับ ตรงกัน");
    }
    // ── ลบงานทดแทน → เอา lot ออกจากสต๊อก + ประวัติรับ ด้วย ──
    async function removeReplacementStock(rec, idx) {
        const reps = ngReps(rec);
        const rep = reps[idx];
        if (!rep) return;
        if (!window.confirm(`ลบงานทดแทน lot ${rep.lotNo}? (จะเอาออกจากสต๊อกและประวัติรับด้วย)`)) return;
        const newReps = reps.filter((_, i) => i !== idx);
        const upNg = ngReturns.map(r => { if (r.id !== rec.id) return r; const nr = { ...r, replacements: newReps, replaceLotNo: undefined, replaceDate: undefined, replaceBy: undefined }; nr.status = ngStatus(nr); return nr; });
        await saveNgReturns(upNg);
        if (rec.matId) {
            const cur = (lots[rec.matId] || []).find(l => l.lotNo === rep.lotNo);
            setLots(ls => ({ ...ls, [rec.matId]: (ls[rec.matId] || []).filter(l => l.lotNo !== rep.lotNo) }));
            if (cur && cur._dbId) await sb.from('sf_lots').delete().eq('id', cur._dbId);
        }
        setRecvHist(h => h.filter(x => x.lotNo !== rep.lotNo));
        await sb.from('sf_recvhist').delete().eq('lot_no', rep.lotNo);
        logAudit("NG", "ลบงานทดแทน", `${rec.name} · lot ทดแทน ${rep.lotNo} (เอาออกจากสต๊อก) · เคลม lot เดิม ${rec.lotNo}`);
        toast(`🗑️ ลบงานทดแทน lot ${rep.lotNo} + เอาออกจากสต๊อกแล้ว`, "warn");
    }

        const cnt = { materials: (d.materials || []).length, requests: (d.requests || []).length,
            issueHist: (d.issueHist || []).length, recvHist: (d.recvHist || []).length,
            lots: Object.values(d.lots || {}).reduce((s, a) => s + (a || []).length, 0) };
        const msg = "⚠️ กู้คืนข้อมูลทั้งระบบจาก " + (srcLabel || "ไฟล์สำรอง") + "\n"
            + "วันที่สำรอง: " + (d.exportedAt || "ไม่ทราบ") + "\n\n"
            + "จะได้: วัตถุดิบ " + cnt.materials + " · Lot " + cnt.lots + " · ใบเบิก " + cnt.requests
            + " · ประวัติเบิก " + cnt.issueHist + " · ประวัติรับ " + cnt.recvHist + "\n\n"
            + "ข้อมูลปัจจุบันในฐานข้อมูลจะถูกลบทิ้งทั้งหมดและแทนที่ด้วยชุดนี้\nดำเนินการต่อหรือไม่?";
        if (!window.confirm(msg)) return false;
        if (!window.confirm("ยืนยันอีกครั้ง — การกู้คืนย้อนกลับไม่ได้\nพิมพ์ตกลงเพื่อเริ่ม")) return false;
        setIsRestoring(true);
        try {
            // 1) สำรองสภาพปัจจุบันไว้ก่อน
            saveLocalBackup(buildBackup({ master, materials, lots, requests, issueHist, recvHist, users, ngReturns, auditLog, priceMap, lotPriceMap, partDb }));
            // 2) ล้างของเดิม (ลบทีละตาราง — ใช้เงื่อนไขที่จริงเสมอเพื่อลบทุกแถว)
            const wipe = async (tbl, col) => { const { error } = await sb.from(tbl).delete().not(col, 'is', null); if (error) throw new Error(tbl + ": " + error.message); };
            setRestoreMsg("กำลังล้างข้อมูลเดิม...");
            await wipe('sf_issuehist', 'id'); await wipe('sf_recvhist', 'id');
            await wipe('sf_lots', 'id'); await wipe('sf_requests', 'id'); await wipe('sf_materials', 'id');
            // 3) เขียนชุดใหม่
            const chunk = async (tbl, rows, label) => {
                if (!rows.length) return;
                for (let i = 0; i < rows.length; i += 200) {
                    setRestoreMsg("กำลังกู้คืน " + label + " (" + Math.min(i + 200, rows.length) + "/" + rows.length + ")...");
                    const { error } = await sb.from(tbl).insert(rows.slice(i, i + 200));
                    if (error) throw new Error(label + ": " + error.message);
                }
            };
            await chunk('sf_materials', (d.materials || []).map(matToDb), "วัตถุดิบ");
            const lotRows = [];
            Object.keys(d.lots || {}).forEach(mid => (d.lots[mid] || []).forEach(l => lotRows.push(lotToDbRow(mid, l))));
            await chunk('sf_lots', lotRows, "Lot");
            await chunk('sf_requests', (d.requests || []).map(reqToDb), "ใบเบิก");
            await chunk('sf_issuehist', (d.issueHist || []).map(issueToDbRow), "ประวัติเบิก");
            await chunk('sf_recvhist', (d.recvHist || []).map(recvToDbRow), "ประวัติรับ");
            // 4) ตาราง master (เก็บเป็น JSON รายก้อน)
            setRestoreMsg("กำลังกู้คืนข้อมูลตั้งค่า...");
            if (d.master) { const { error } = await sb.from('sf_master').upsert({ id: 'main', ...d.master }); if (error) throw new Error("master: " + error.message); }
            const mrow = async (id, val) => { if (val == null) return; const { error } = await sb.from('sf_master').upsert({ id: id, part_names: val }); if (error) throw new Error(id + ": " + error.message); };
            await mrow('partnos', d.partDb); await mrow('prices', d.priceMap);
            await mrow('lotprices', d.lotPriceMap); await mrow('ngreturns', d.ngReturns); await mrow('auditlog', d.auditLog);
            // 5) users (ไม่ลบทิ้ง เพราะอาจล็อกตัวเองออกจากระบบ — ใช้ upsert เติมทับ)
            if ((d.users || []).length) {
                const { error } = await sb.from('sf_users').upsert((d.users || []).map(u => ({ id: u.id, user_name: u.name, pin: u.pin, role: u.role, active: u.active !== false })));
                if (error) throw new Error("users: " + error.message);
            }
            setRestoreMsg("สำเร็จ! กำลังโหลดข้อมูลใหม่...");
            setTimeout(() => window.location.reload(), 900);
            return true;
        }
        catch (e) {
            setIsRestoring(false);
            setRestoreMsg("");
            alert("❌ กู้คืนไม่สำเร็จ: " + e.message + "\n\nข้อมูลอาจกู้คืนไปได้บางส่วน กรุณาลองใหม่อีกครั้งด้วยไฟล์เดิม");
            return false;
        }
    }

    // ── REQUEST actions ──

        const builtItems = items.map(i => {

            return { matId: i.matId, name: `${m.name || m.type} ${m.size}`, maker: m.maker, temper: (m.temper && m.temper !== "-") ? m.temper : "", partNo: m.partNo, model: i.model || "", customer: i.customer || "",

        const yr = new Date().getFullYear();

            const revNums = requests.filter(r => r.id.startsWith(baseId + "-R")).map(r => parseInt(r.id.split("-R").pop()) || 0);
            const nextRev = revNums.length > 0 ? Math.max(...revNums) + 1 : 1;
            id = `${baseId}-R${String(nextRev).padStart(2, "0")}`;
        }
        else {
            const maxSeq = requests.filter(r => r.id.startsWith(`REQ-${yr}-`) && !r.id.includes("-R")).reduce((max, r) => { const n = parseInt(r.id.split("-")[2] || 0); return n > max ? n : max; }, 0);
            id = `REQ-${yr}-${String(maxSeq + 1).padStart(4, "0")}`;
        }
        const { _revisedFrom, _originalData, ...rqClean } = rqForm;
        // ลูกค้าระดับใบ: ดึงจากรายการวัตถุดิบรายการแรกที่มีลูกค้า (ช่องลูกค้าระดับใบถูกถอดออก เพราะซ้ำกับรายการ)
        const derivedCust = rqClean.customer || ((builtItems.find(x => x.customer) || {}).customer) || null;
        const newReq = { ...rqClean, customer: derivedCust, id, status: "pending", approvedBy: null, issuedBy: null, issuedDate: null, items: builtItems, revisedFrom: _revisedFrom || null };
        await sb.from('sf_requests').insert(reqToDb(newReq));
        // หมายเหตุ: ใบเดิมจะถูกถือว่า "ถูกแทนที่/แก้ไขแล้ว" โดยอัตโนมัติผ่าน isSupersededReq
        //   (ดูจากความสัมพันธ์ revised_from ของใบใหม่) — ไม่ต้องเขียนสถานะ "revised" ลง DB
        //   เพราะคอลัมน์ status มี CHECK constraint ที่ไม่รับค่านั้น และจะกันการอนุมัติที่ approveReq อยู่แล้ว
        setRequests(r => [newReq, ...r]);
        setModal(null);
        setRqForm(emptyRq());
        toast(`✅ สร้างใบเบิก ${id}${_revisedFrom ? ` (แก้ไขจาก ${_revisedFrom})` : ""} — รอหัวหน้าอนุมัติ`);
        setTimeout(() => toast(`📧 ส่ง Email แจ้งเตือนหัวหน้างานแล้ว`, "info"), 700);
    }
    async function approveReq(id) {
        // ── กันอนุมัติใบที่ถูกแก้ไข (Revised) แล้ว ──
        // เช็กล่าสุดจากฐานข้อมูลก่อนเสมอ เผื่อมีคนอื่นเพิ่งแก้ไขใบนี้ระหว่างที่รออนุมัติ
        try {
            const { data: fresh } = await sb.from('sf_requests')
                .select('id,status,revised_from')
                .or(`id.eq.${id},revised_from.eq.${id}`);
            if (fresh && fresh.length) {
                const self = fresh.find(r => r.id === id);
                const child = fresh.find(r => r.revised_from === id && r.status !== "rejected");
                if (self && self.status === "revised") {
                    setRequests(rs => rs.map(r => r.id === id ? { ...r, status: "revised" } : r));
                    toast(`⛔ ใบ ${id} ถูกแก้ไขเป็นฉบับใหม่แล้ว — อนุมัติไม่ได้`, "err");
                    setModal(null);
                    return;
                }
                if (child) {
                    toast(`⛔ ใบ ${id} มีฉบับแก้ไขแล้ว (${child.id}) — กรุณาอนุมัติฉบับล่าสุดแทน`, "err");
                    setModal(null);
                    return;
                }
                if (self && (self.status === "approved" || self.status === "issued")) {
                    toast(`ℹ️ ใบ ${id} ถูกดำเนินการไปแล้ว (${self.status})`, "warn");
                    setModal(null);
                    return;
                }
            }
        } catch (e) { console.warn('approve precheck failed:', e); }

        const updated = { status: "approved", approvedBy: (currentUser === null || currentUser === void 0 ? void 0 : currentUser.name) || "หัวหน้างาน", approvedAt: new Date().toISOString() };
        await sb.from('sf_requests').update({ status: updated.status, approved_by: updated.approvedBy, approved_at: updated.approvedAt }).eq('id', id);
        setRequests(rs => rs.map(r => r.id === id ? { ...r, ...updated } : r));
        toast(`✅ อนุมัติ ${id} — โดย ${(currentUser === null || currentUser === void 0 ? void 0 : currentUser.name) || "หัวหน้างาน"}`);
        setTimeout(() => toast(`📧 ส่ง Email แจ้งสโตร์แล้ว`, "info"), 600);
        setModal(null);
    }

    async function issueReq(id) {
    const r = requests.find(x => x.id === id);
    if (!r) return;

    // 1. Check Stock First
    const noStk = r.items.filter(it => {
        const ml = lots[it.matId] || [];
        const tot = ml.reduce((s, l) => s + (l.rem_pcs || 0) + (l.rem_kgs || 0) + (l.rem_coil || 0) + (l.rem_m || 0), 0);
        return tot <= 0;
    });

    if (noStk.length > 0) {
        setNoStkItems(noStk);
        setModal("nostock");
        return;
    }

    const today = new Date().toISOString().split("T")[0];
    const issuedByName = currentUser?.name || "พนักงานสโตร์";

    // 2. Update Request Status (local + DB)
    setRequests(rs => rs.map(x => x.id === id ? {
        ...x, status: "issued", issuedBy: issuedByName, issuedDate: today
    } : x));
    await sb.from('sf_requests').update({ status: "issued", issued_by: issuedByName, issued_date: today }).eq('id', id);

    // Prepare arrays to hold data for batch updates
    let newHistoryRecords = [];
    const workingLots = {}; // สำเนาที่ตัดต่อเนื่อง เผื่อ matId เดียวกันมีหลายบรรทัดในใบเดียว

    // 3. Process Items using for...of (to allow await)
    for (const item of r.items) {
        const selKey = `${r.items.indexOf(item)}_${item.matId}`;
        // เลข Lot จริงที่สโตร์จดมา — ถ้ามี ให้ลงประวัติเบิกด้วยเลขนี้
        const realLotNo = String((realLots && realLots[selKey]) || "").trim();
        const chosenLots = (selectedLots && selectedLots[selKey]) || [];

        // Logic for updating Lots: คำนวณยอดตัด แล้วบันทึกกลับเข้า DB (sf_lots)
        const ml = [...(workingLots[item.matId] || lots[item.matId] || [])];
        const matInfo = materials.find(x => x.id === item.matId);
        const unit = item.unit || matInfo?.unit || "PCS";
        let rem = parseFloat(item.qty) || 0;

        const sortedByDate = [...ml].sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));
        // ถ้ามี Lot No. ซ้ำกันหลายแถว ต้องเอาทุกแถวมาไล่ตัด ไม่ใช่แค่แถวแรก
        // เดิมใช้ findIndex ได้แถวเดียว ถ้าแถวนั้นของหมดแล้วจะข้ามไปเลย
        // ทำให้ "เบิกแล้วสต๊อกไม่ลด" ทั้งที่ยังมีของอยู่ในแถวที่ชื่อเดียวกัน
        const idxOfLot = no => ml.map((l, i) => (l.lotNo === no ? i : -1)).filter(i => i >= 0);
        const processOrder = chosenLots.length > 0
            ? chosenLots.flatMap(cl => idxOfLot(cl.lotNo).map(lotIdx => ({ lotIdx: lotIdx, fixedQty: cl.qty })))
            : sortedByDate.flatMap(l => idxOfLot(l.lotNo).map(lotIdx => ({ lotIdx: lotIdx, fixedQty: null })))
        const _seenIdx = new Set();
        // กันแถวเดิมถูกไล่ซ้ำ (เพราะ Lot ซ้ำ 2 แถวจะให้ index ชุดเดียวกันทั้งคู่)
        const processOrderU = processOrder.filter(x => { if (_seenIdx.has(x.lotIdx)) return false; _seenIdx.add(x.lotIdx); return true; });

        const changedIdx = new Set();
        const cuts = []; // บันทึก "การตัดจริง" ต่อ lot เพื่อให้ประวัติ (lot_no + จำนวน) ตรงกับสต๊อกที่ตัดออกจริง
        for (const { lotIdx: i, fixedQty } of processOrderU) {
            if (rem <= 0) break;
            const takeAmt = fixedQty != null ? Math.min(fixedQty, rem) : rem;
            const lotNo = ml[i].lotNo;

            if (unit === "M" || (ml[i].rem_m != null && ml[i].rem_pcs == null && ml[i].rem_kgs == null && ml[i].rem_coil == null)) {
                // ตัดเป็นเมตร — ถ้า lot มีจำนวนม้วนด้วย จะตัดม้วนตามสัดส่วนจริงของ lot (เช่น 1 ม้วน = 100 เมตร)
                const take = Math.min(takeAmt, ml[i].rem_m || 0);
                if (take <= 0) continue;
                const mPerCoil = (ml[i].coil && ml[i].m) ? (ml[i].m / ml[i].coil) : 0;
                const cutCoil = (ml[i].rem_coil != null && mPerCoil > 0) ? Math.min(ml[i].rem_coil, take / mPerCoil) : null;
                ml[i] = { ...ml[i], rem_m: Math.max(0, (ml[i].rem_m || 0) - take) };
                if (cutCoil != null)
                    ml[i] = { ...ml[i], rem_coil: Math.max(0, (ml[i].rem_coil || 0) - cutCoil) };
                cuts.push({ lotNo, coil: cutCoil != null ? Math.round(cutCoil * 100) / 100 : null, kgs: null, pcs: null, m: take });
                rem -= take;
            } else if (unit === "COIL" || (ml[i].rem_coil != null && ml[i].rem_pcs == null && ml[i].rem_kgs == null)) {
                const take = Math.min(takeAmt, ml[i].rem_coil || 0);
                if (take <= 0) continue;
                const kgsPerCoil = (ml[i].coil && ml[i].kgs) ? (ml[i].kgs / ml[i].coil) : 0;
                const cutKgs = ml[i].rem_kgs != null ? take * kgsPerCoil : null;
                const mPerCoil2 = (ml[i].coil && ml[i].m) ? (ml[i].m / ml[i].coil) : 0;
                const cutM = (ml[i].rem_m != null && mPerCoil2 > 0) ? Math.min(ml[i].rem_m, take * mPerCoil2) : null;
                ml[i] = { ...ml[i], rem_coil: Math.max(0, (ml[i].rem_coil || 0) - take), rem_kgs: ml[i].rem_kgs != null ? Math.max(0, (ml[i].rem_kgs || 0) - (take * kgsPerCoil)) : ml[i].rem_kgs };
                ml[i] = cutM != null ? { ...ml[i], rem_m: Math.max(0, (ml[i].rem_m || 0) - cutM) } : ml[i];
                cuts.push({ lotNo, coil: take, kgs: cutKgs, pcs: null, m: cutM != null ? Math.round(cutM * 100) / 100 : null });
                rem -= take;
            } else if (unit === "KGS" && ml[i].rem_kgs != null) {
                // เบิกเป็น KGS → ต้องตัดจาก rem_kgs เสมอ
                // (เดิมมีเงื่อนไข rem_pcs == null ทำให้ lot ที่มีทั้ง KGS+PCS (unit BOTH) ตกไปตัด PCS แทน = ตัดผิดช่อง)
                const take = Math.min(takeAmt, ml[i].rem_kgs || 0);
                if (take <= 0) continue;
                // ถ้า lot มี PCS ด้วย → ตัด PCS ตามสัดส่วนจริงของ lot (kgs:pcs) ให้ยอดสองหน่วยสอดคล้องกัน
                const pcsPerKg = (ml[i].kgs && ml[i].pcs) ? (ml[i].pcs / ml[i].kgs) : (matInfo && matInfo.kpp ? 1 / matInfo.kpp : 0);
                const cutPcs = (ml[i].rem_pcs != null && pcsPerKg > 0) ? Math.min(ml[i].rem_pcs, take * pcsPerKg) : null;
                ml[i] = { ...ml[i], rem_kgs: Math.max(0, (ml[i].rem_kgs || 0) - take) };
                if (cutPcs != null)
                    ml[i] = { ...ml[i], rem_pcs: Math.max(0, (ml[i].rem_pcs || 0) - cutPcs) };
                cuts.push({ lotNo, coil: null, kgs: take, pcs: cutPcs != null ? Math.round(cutPcs * 100) / 100 : null, m: null });
                rem -= take;
            } else {
                const take = Math.min(takeAmt, ml[i].rem_pcs || 0);
                if (take <= 0) continue;
                // แปลง PCS -> KGS ด้วยสัดส่วนจริงของ lot ก่อน ถ้าไม่มีค่อยใช้ kpp ของ material
                const kgsPerPcs = (ml[i].kgs && ml[i].pcs) ? (ml[i].kgs / ml[i].pcs) : ((matInfo && matInfo.kpp) ? matInfo.kpp : 0);
                const cutKgs = (ml[i].rem_kgs != null && kgsPerPcs > 0) ? Math.min(ml[i].rem_kgs, take * kgsPerPcs) : null;
                ml[i] = { ...ml[i], rem_pcs: Math.max(0, (ml[i].rem_pcs || 0) - take) };
                if (cutKgs != null)
                    ml[i] = { ...ml[i], rem_kgs: Math.max(0, (ml[i].rem_kgs || 0) - cutKgs) };
                cuts.push({ lotNo, coil: null, kgs: cutKgs != null ? Math.round(cutKgs * 1000) / 1000 : null, pcs: take, m: null });
                rem -= take;
            }
            changedIdx.add(i);
        }
        workingLots[item.matId] = ml;
        setLots(ls => ({ ...ls, [item.matId]: ml }));
        // บันทึกยอดคงเหลือที่ตัดแล้วกลับเข้าฐานข้อมูล (ก่อนหน้านี้ไม่ถูกบันทึก → สต๊อกกลางเพี้ยน)
        for (const i of changedIdx) {
            const lot = ml[i];
            if (lot && lot._dbId) {
                await updateLot(lot._dbId, {
                    rem_kgs: lot.rem_kgs != null ? lot.rem_kgs : null,
                    rem_pcs: lot.rem_pcs != null ? lot.rem_pcs : null,
                    rem_coil: lot.rem_coil != null ? lot.rem_coil : null,
                    rem_m: lot.rem_m != null ? lot.rem_m : null
                });
            }
        }

        // 4. สร้างประวัติจาก "การตัดจริง" (cuts) → lot_no + จำนวน ตรงกับสต๊อกที่ตัดออกจริงทุก lot
        const cutSource = cuts.length > 0 ? cuts : [{ lotNo: item.lotNo, coil: item.coil, kgs: item.kgs, pcs: item.qty, m: item.m != null ? item.m : null }];
        const itemTp = (() => { if (item.temper && item.temper !== "-") return item.temper;
            const mm = materials.find(x => x.id === item.matId); return (mm && mm.temper && mm.temper !== "-") ? mm.temper : ""; })();
        const recordsToInsert = cutSource.map(c => {
            const rec = {
                issue_date: today, req_id: r.id, material_name: item.name, maker: item.maker,
                lot_no: realLotNo || c.lotNo,
                pcs: c.pcs != null ? c.pcs : null,
                kgs: c.kgs != null ? c.kgs : null,
                coil: c.coil != null ? c.coil : null,
                unit: item.unit, forecast: r.forecast, dept: r.dept, requester: r.requester,
                approver: r.approvedBy, issued_by: issuedByName
            };
            if (ISSUEHIST_HAS_TEMPER) rec.temper = itemTp || null;
            if (ISSUEHIST_HAS_M) rec.m = c.m != null ? c.m : null;
            return rec;
        });

        // Insert to Supabase
        const { error } = await sb.from('sf_issuehist').insert(recordsToInsert);
        if (error) console.error("DB Error:", error);
        
        newHistoryRecords.push(...recordsToInsert);
    }

    // 5. Finalize UI
    // แปลงชื่อคอลัมน์จาก DB (snake_case) → รูปแบบที่หน้าจอใช้ (camelCase)
    // มิฉะนั้นแถวที่เพิ่งจ่ายจะแสดง วัตถุดิบ/Lot/เลขใบเบิก/ผู้จ่าย เป็นค่าว่างจนกว่าจะ refresh
    const newHistCamel = newHistoryRecords.map(h => ({
        date: h.issue_date, reqId: h.req_id, name: h.material_name, temper: h.temper || "", maker: h.maker,
        lotNo: h.lot_no, pcs: h.pcs, kgs: h.kgs, coil: h.coil, m: h.m != null ? h.m : null, unit: h.unit,
        forecast: h.forecast, dept: h.dept, requester: h.requester,
        approver: h.approver, issuedBy: h.issued_by
    }));
    setIssueHist(h => [...newHistCamel, ...h]);
    toast("📤 จ่ายวัตถุดิบสำเร็จ! ตัดยอด FIFO แล้ว");
    setModal(null);
    setSelectedLots({});
    setRealLots({});
    setTimeout(() => toast("📧 ส่ง Email แจ้งฝ่ายผลิตแล้ว", "info"), 600);
}
    // ── RECEIVE ──
    async function submitRecv() {
        const { date, po, inv, type, matId, maker, rohs, lots: rvLots } = rvForm;
        if (!matId) {
            toast("กรุณาเลือกวัตถุดิบ", "err");
            return;
        }
        if (!maker) {
            toast("กรุณาเลือก Maker", "err");
            return;
        }
        const validLots = rvLots.filter(l => l.lotNo);
        if (!validLots.length) {
            toast("กรุณาระบุ Lot No. อย่างน้อย 1 รายการ", "err");
            return;
        }
        // หา material ปลายทางที่จะรับเข้า
        // สำคัญ: ต้องยึด material ที่ผู้ใช้เลือก (คง Temper เดิม) ห้ามค้นใหม่ด้วย size+maker เฉยๆ
        // เพราะ name+size+maker เดียวกันอาจมีหลาย temper (เช่น SUS 14x1.0x4000 มีทั้ง No.1AP / ASW-TKC)
        // → เดิมจะคว้าตัวแรกที่เจอ ทำให้ของเข้าผิด temper
        const sameTemper = (a, b) => ((a && a.temper) || "") === ((b && b.temper) || "");
        const newMats = []; // material ที่ต้องสร้างใหม่ระหว่างนี้ (เปลี่ยน maker)
        function resolveTarget(baseId) {
            const baseMat = materials.find(x => x.id === baseId) || newMats.find(x => x.id === baseId);
            if (!baseMat) return null;
            let targetMat = null;
            if (!maker || baseMat.maker === maker) {
                targetMat = baseMat; // ไม่ได้เปลี่ยน maker → ใช้ตัวที่เลือกตรงๆ
            }
            else {
                // เปลี่ยน maker → หาตัวที่ ชื่อ+size+ประเภท+temper ตรงกัน และเป็น maker ใหม่
                const same = x => x.size === baseMat.size && x.name === baseMat.name && x.type === baseMat.type && sameTemper(x, baseMat) && x.maker === maker;
                targetMat = materials.find(x => x.active !== false && same(x)) || newMats.find(same);
            }
            // ถ้าไม่มี row ของ maker นี้ → สร้างใหม่อัตโนมัติ (คง temper เดิม)
            if (!targetMat && maker && maker !== baseMat.maker) {
                const newId = baseMat.type + Date.now() + "_" + newMats.length + "_" + maker.replace(/\s+/g, "");
                targetMat = { ...baseMat, id: newId, maker };
                newMats.push(targetMat);
            }
            return targetMat || baseMat;
        }
        // ── จัดกลุ่ม Lot ตาม size ปลายทาง (1 ใบรับ = หลายความยาวได้) ──
        const groups = [];
        for (const l of validLots) {
            const tm = resolveTarget(l.matId || matId);
            if (!tm) { toast("ไม่พบวัตถุดิบปลายทางของ Lot " + l.lotNo, "err"); return; }
            let g = groups.find(x => x.realMatId === tm.id);
            if (!g) { g = { mat: tm, realMatId: tm.id, lots: [] }; groups.push(g); }
            g.lots.push(l);
        }
        const _lk = v => String(v == null ? "" : v).trim().toLowerCase();
        // กัน Lot ซ้ำ — แต่ maker บางเจ้าส่ง Lot No. เดิมมาคนละ PO / คนละ Invoice ซึ่งเป็นของคนละชุดจริง
        // จึงห้ามเฉพาะกรณีที่ "ซ้ำทุกอย่าง" (Lot + PO + Invoice) ซึ่งแปลว่ากดปุ่มซ้ำ
        // ถ้า PO หรือ Invoice ต่างกัน → ถามยืนยันแล้วให้ผ่านได้ เพื่อไม่ให้ของจริงเข้าคลังไม่ได้
        for (const g of groups) {
            const existLots = lots[g.realMatId] || [];
            // หา PO/Invoice ของ lot เดิมจากประวัติการรับ (sf_lots ไม่มีช่อง Invoice)
            const matTxt = `${g.mat.name} ${g.mat.size}`;
            const recvOf = lotNo => (recvHist || []).find(x => _lk(x.lotNo) === _lk(lotNo) && _lk(x.name) === _lk(matTxt)) || {};
            const hardDup = [], softDup = [];
            g.lots.forEach(l => {
                const ex = existLots.find(x => _lk(x.lotNo) === _lk(l.lotNo));
                if (!ex) return;
                const r = recvOf(l.lotNo);
                const samePo = _lk(ex.po) === _lk(po);
                const sameInv = _lk(r.inv) === _lk(inv);
                if (samePo && sameInv) hardDup.push(l.lotNo);
                else softDup.push({ lotNo: l.lotNo, oldPo: ex.po || "-", oldInv: r.inv || "-" });
            });
            if (hardDup.length) {
                toast("⛔ Lot No. " + hardDup.join(", ") + " รับเข้าไปแล้วด้วย PO/Invoice ชุดเดียวกัน (" + (g.mat.size || "").replace(/^size:/i, "") + ") — น่าจะกดซ้ำ ถ้าเป็นของคนละชุดให้แก้ PO หรือ Invoice ให้ตรงตามเอกสาร", "err");
                return;
            }
            if (softDup.length) {
                const txt = softDup.map(d => "  • Lot " + d.lotNo + "\n      เดิม: PO " + d.oldPo + " / INV " + d.oldInv
                    + "\n      ครั้งนี้: PO " + (po || "-") + " / INV " + (inv || "-")).join("\n");
                if (!window.confirm("Lot No. นี้มีอยู่ในคลังแล้ว แต่ PO/Invoice ไม่เหมือนกัน\n"
                    + (g.mat.size || "").replace(/^size:/i, "") + "\n\n" + txt
                    + "\n\nถ้าเป็นของคนละชุดที่ maker ส่งมาด้วยเลข Lot เดิม กด OK เพื่อรับเข้าเพิ่ม\nถ้ากรอกผิด กด Cancel")) return;
            }
            // ซ้ำกันเองในใบรับใบนี้ (size เดียวกัน Lot No. เดียวกัน 2 บรรทัด)
            const seen = {};
            for (const l of g.lots) {
                if (seen[_lk(l.lotNo)]) { toast("⛔ Lot No. " + l.lotNo + " ซ้ำกันเองในใบรับนี้ (" + (g.mat.size || "").replace(/^size:/i, "") + ")", "err"); return; }
                seen[_lk(l.lotNo)] = 1;
            }
        }
        if (newMats.length) setMaterials(ms => [...ms, ...newMats]);
        const priceUpd = {};
        for (const g of groups) {
            const m = g.mat;
            const realMatId = g.realMatId;
            for (const l of g.lots) {
                const newLot = { lotNo: l.lotNo, date, po, maker, pcs: parseFloat(l.pcs) || null, coil: parseFloat(l.coil) || null,
                    kgs: parseFloat(l.kgs) || null, rem_kgs: parseFloat(l.kgs) || null, rem_pcs: parseFloat(l.pcs) || null,
                    rem_coil: parseFloat(l.coil) || null,
                    m: parseFloat(l.m) || null, rem_m: parseFloat(l.m) || null, rohs };

                // บันทึกลง Supabase
                await saveLot(realMatId, newLot);

                // อัพเดท local state
                setLots(ls => ({ ...ls, [realMatId]: [...(ls[realMatId] || []), newLot] }));

                // บันทึก receive history
                const histRecord = { date, po, inv, name: `${m.name} ${m.size}`, temper: (m.temper && m.temper !== "-") ? m.temper : "", maker, lotNo: l.lotNo, pcs: newLot.pcs, coil: newLot.coil, kgs: newLot.kgs, m: newLot.m, rohs };
                const recvPayload = {
                    receive_date: histRecord.date,
                    po: histRecord.po || null,
                    inv: histRecord.inv || null,
                    material_name: histRecord.name,
                    maker: histRecord.maker,
                    lot_no: histRecord.lotNo,
                    pcs: histRecord.pcs,
                    coil: histRecord.coil,
                    kgs: histRecord.kgs,
                    rohs: histRecord.rohs
                };
                if (RECVHIST_HAS_TEMPER) recvPayload.temper = histRecord.temper || null;
                if (RECVHIST_HAS_M) recvPayload.m = histRecord.m || null;
                await sb.from('sf_recvhist').insert(recvPayload);
                setRecvHist(h => [histRecord, ...h]);
            }
            // บันทึกราคา/หน่วย ต่อ lot ที่กรอกตอนรับ
            g.lots.forEach(l => { const p = parseFloat(l.price); if (!isNaN(p) && p > 0) priceUpd[realMatId + "||" + l.lotNo] = { p: p, u: l.priceUnit || autoPriceUnit(l.kgs, l.pcs, l.coil, l.m) }; });
        }
        if (Object.keys(priceUpd).length) {
            const next = { ...lotPriceMap, ...priceUpd };
            setLotPriceMap(next);
            await sb.from('sf_master').upsert({ id: 'lotprices', part_names: next });
        }
        const g0 = groups[0];
        toast(groups.length > 1
            ? `✅ รับ ${g0.mat.name} (${maker}) ${groups.length} size / ${validLots.length} Lot สำเร็จ`
            : `✅ รับ ${g0.mat.name} ${g0.mat.size} (${maker}) จำนวน ${validLots.length} Lot สำเร็จ`);
        setRvForm(emptyRv());
    }
    // ── เพิ่ม "ความยาวใหม่" จากหน้ารับวัตถุดิบ ──
    // ก๊อปทุกอย่างจากตัวต้นแบบในกลุ่มเดียวกัน เปลี่ยนแค่ Size (รูปแบบถูกสร้างให้ กัน format เพี้ยน)
    // ไม่ก๊อป Part No. สินค้า/ลูกค้า เพราะแต่ละความยาวใช้กับสินค้าคนละตัว ถ้าก๊อปมาจะผูกผิด
    async function addLengthMat(baseMat, newSize, mkIn) {
        if (!baseMat || !newSize) return null;
        const mk = mkIn || baseMat.maker;
        const nk = s => String(s == null ? "" : s).replace(/^size:/i, "").replace(/[^0-9.]/g, "");
        const exist = materials.find(x => x.active !== false && x.type === baseMat.type && x.name === baseMat.name
            && ((x.temper || "") === (baseMat.temper || "")) && x.maker === mk && nk(x.size) === nk(newSize));
        if (exist) { toast("ℹ️ มี " + newSize + " อยู่แล้ว — ใช้ตัวเดิม", "info"); return exist; }
        const row = { ...baseMat, id: baseMat.type + Date.now(), size: newSize, maker: mk,
            extraMakers: [], allMakers: [mk], customers: [], productPartNos: [], remark: "", active: true };
        const { error } = await sb.from('sf_materials').insert(matToDb(row));
        if (error) { console.error(error); toast("❌ สร้างความยาวใหม่ไม่สำเร็จ: " + error.message, "err"); return null; }
        setMaterials(ms => [...ms, row]);
        logAudit("Material", "เพิ่มความยาวใหม่ (จากหน้ารับวัตถุดิบ)",
            `${row.name} ${newSize}${row.temper && row.temper !== "-" ? " (" + row.temper + ")" : ""} · ${mk} · ก๊อปจาก ${(baseMat.size || "").replace(/^size:/i, "")}`);
        toast(`✅ เพิ่ม ${newSize} แล้ว — ถ้าใช้กับ Part No. ไหน อย่าลืมไปผูกที่หน้าจัดการ Part No.`);
        return row;
    }
    // ── MATERIAL MASTER ──
    async function saveMat() {
        const maker = mmForm.makerNew || mmForm.maker;
        // กันเคสพิมพ์/วางชื่อ material ปนไปในช่อง Size โดยไม่ตั้งใจ (เช่น "Copper Ring size:1.6x6.9")
        // ซึ่งทำให้ _normSizeKey คลาดเคลื่อนและจับคู่กับ Part No./Dead Stock/FIFO ไม่ได้เลย
        // ใช้ตัวแปร local เพราะ setMmForm เป็น async — ค่าที่ set จะยังไม่ทันใช้ในฟังก์ชันนี้
        let cleanSize = mmForm.size || "";
        if (mmForm.name && cleanSize) {
            const nameTrim = mmForm.name.trim();
            const nameLC = nameTrim.toLowerCase();
            const sizeLC = cleanSize.trim().toLowerCase();
            if (nameLC && sizeLC.indexOf(nameLC) === 0) {
                const cleaned = cleanSize.trim().slice(nameTrim.length).replace(/^[\s:.\-]+/, "");
                if (cleaned) cleanSize = cleaned;
            }
        }
        // บังคับรูปแบบมาตรฐานทุกครั้งที่บันทึก — เติม Ø ให้ท่อโลหะ, ตัด mm, ใช้ x ตัวเล็ก
        // กันคนกรอกลืมใส่/ใส่ไม่เหมือนกันจนข้อมูลไม่เรียงร้อยอีก
        cleanSize = normSizeText(cleanSize, mmForm.type);
        if (cleanSize !== mmForm.size) setMmForm(f => ({ ...f, size: cleanSize }));
        if (!mmForm.partNo)
            setMmForm(f => ({ ...f, partNo: mmForm.type + cleanSize.replace(/[^a-zA-Z0-9]/g, "") }));
        const autoPartNo = mmForm.partNo || (mmForm.type + cleanSize.replace(/[^a-zA-Z0-9]/g, ""));
        const errs = {};
        if (!mmForm.type)
            errs.type = "กรุณาเลือกประเภทวัตถุดิบ";
        // PART ASSY ไม่มี "ชนิด material" แบบท่อโลหะ → ไม่บังคับชื่อ (จะเติมจาก Part No. ให้อัตโนมัติ)
        if (!mmForm.name && mmForm.type !== "PART ASSY")
            errs.name = "กรุณาระบุ Type Material เช่น AL PIPE, COPPER TUBE — ถ้ายังไม่มีในรายการ กดปุ่ม ➕ ชื่อใหม่";
        if (!cleanSize)
            errs.size = "กรุณากรอก Size";
        if (!maker)
            errs.maker = "กรุณาเลือกหรือกรอก Maker";
        if (Object.keys(errs).length > 0) {
            setMmErrors(errs);
            toast("❌ กรุณากรอกข้อมูลที่ระบุ * ให้ครบ", "err");
            return;
        }
        setMmErrors({});
        // ถ้าไม่มีชื่อ (โดยเฉพาะ PART ASSY) → เติมจาก Part No. สินค้าตัวแรก ไม่งั้นใช้รหัส Part No. ของ material
        const firstProdPn = (mmForm.productPartNos || []).filter(Boolean)[0] || "";
        const finalName = mmForm.name || firstProdPn || mmForm.partNo;
        if (mmForm.makerNew && !master.makers.find(x => x.name === mmForm.makerNew)) {
            addMaker(mmForm.makerNew, [mmForm.type]);
        }
        if (mmForm.editId) {
            const updatedMat = { ...mmForm, name: finalName, size: cleanSize, maker, extraMakers: mmForm.extraMakers || [], allMakers: [maker, ...(mmForm.extraMakers || [])].filter(Boolean), kpp: parseFloat(mmForm.kpp) || null, minStock: parseInt(mmForm.minStock) || 100, customers: mmForm.customers || [], productPartNos: mmForm.productPartNos || [] };
            const { error: upErr } = await sb.from('sf_materials').update(matToDb({ ...materials.find(m => m.id === mmForm.editId), ...updatedMat })).eq('id', mmForm.editId);
            if (upErr) { toast("❌ บันทึกไม่สำเร็จ (ยังไม่ได้บันทึกลงฐานข้อมูล): " + upErr.message, "err"); return; }
            setMaterials(ms => ms.map(m => m.id === mmForm.editId ? { ...m, ...updatedMat } : m));
            // บันทึกประวัติ: เทียบค่าเก่า-ใหม่ทีละช่อง ให้ตรวจย้อนหลังได้ว่าใครแก้อะไรจากอะไรเป็นอะไร
            const oldMat = materials.find(m => m.id === mmForm.editId) || {};
            const _fv = v => Array.isArray(v) ? (v.filter(Boolean).join(", ") || "-") : (v == null || v === "" ? "-" : String(v));
            const diffs = [["name", "ชื่อ"], ["size", "Size"], ["temper", "Temper"], ["maker", "Maker"], ["extraMakers", "Maker เสริม"],
                ["unit", "หน่วย"], ["kpp", "KPP"], ["minStock", "Min Stock"], ["customers", "ลูกค้า"], ["remark", "หมายเหตุ"], ["productPartNos", "Part No. สินค้า"]]
                .map(f => { const a = _fv(oldMat[f[0]]), b = _fv(updatedMat[f[0]]); return a === b ? null : `${f[1]}: ${a} → ${b}`; })
                .filter(Boolean);
            logAudit("Material", "แก้ไข Material", `${oldMat.name || finalName} ${(oldMat.size || "").replace(/^size:/i, "")} · ${oldMat.maker || "-"}`
                + (diffs.length ? " | " + diffs.join(" | ") : " | (กดบันทึกแต่ไม่มีค่าใดเปลี่ยน)"));
            toast(`✅ แก้ไข "${finalName} ${cleanSize}" สำเร็จ`);
        }
        else {
            // สร้าง 1 row ต่อ 1 Maker — ให้คลังแยก stock ต่างกัน
            const allNewMakers = [maker, ...(mmForm.extraMakers || []).filter(Boolean)];
            const baseId = mmForm.type + Date.now().toString().slice(-6);
            if (!master.partNames.find(p => p.partNo === autoPartNo)) {
                setMaster(m => ({ ...m, partNames: [...m.partNames, { name: finalName, partNo: autoPartNo, types: [mmForm.type] }] }));
            }
            const ts = Date.now();
            const newRows = allNewMakers.map((mk, mi) => ({
                id: mmForm.type + String(ts + mi),
                partNo: autoPartNo, name: finalName, type: mmForm.type, size: cleanSize,

    const [q, setQ] = useState("");

    // ถ้าเทียบตรงตัวจะค้นไม่เจอบางรายการ
    const _sq = v => String(v == null ? "" : v).replace(/\s+/g, " ").trim().toLowerCase();
    const ql = _sq(q);
    const matPnIdx = {};
    (materials || []).forEach(m => {
        if (m.active === false) return;
        (m.productPartNos || []).forEach(x => {
            const k = String(x == null ? "" : x).replace(/\s+/g, " ").trim().toLowerCase();

            if (!matPnIdx[k]) matPnIdx[k] = [];
            matPnIdx[k].push(m);
        });
    });
    const filtered = list.filter(p => {
        if (onlyUnlinked && (matPnIdx[_sq(p.pn)] || []).length) return false;
        if (cat && (PART_CAT_MAP[p.cat] || p.cat) !== cat) return false;
        if (!ql) return true;

    });

    // (เดิมเรียก findMatsForPart ทุกแถว = regex หลายหมื่นครั้งต่อการพิมพ์ 1 ตัวอักษร → Page unresponsive)
    const matNormIdx = {};
    (materials || []).forEach(m => {
        if (m.active === false) return;

        if (!matNormIdx[k]) matNormIdx[k] = [];
        matNormIdx[k].push(m);
    });
    // ดัชนี "Part No. สินค้า" ที่ผูกไว้กับ material โดยตรง — ต้องชนะการเดาจาก size เสมอ
    // (เดิม fastMats ดูแต่ size ทำให้ part ที่ผูกไว้แล้วยังขึ้นปุ่ม "เพิ่มเข้าคลัง" ทั้งที่มีของ)
    function fastMats(p) {
        // รวมผู้เข้าข่ายทั้งจาก "ผูก Part No. ไว้ตรงๆ" และ "size+หมวดตรง" แล้วให้คะแนนเลือก
        // (ใช้ตรรกะเดียวกับ findMatsForPart แต่อ่านจากดัชนีที่ทำไว้แล้ว จึงเร็วพอสำหรับ ~900 แถว)
        const cat = PART_CAT_MAP[p.cat] || p.cat || "";
        const key = _normSizeKey(p.sz);
        const pnLow = String(p.pn == null ? "" : p.pn).replace(/\s+/g, " ").trim().toLowerCase();
        const ex = (pnLow && matPnIdx[pnLow]) || [];
        const sz = key ? (matNormIdx[cat + "|" + key] || []) : [];
        if (!ex.length && !sz.length) return [];

        const pool = [];
        const seen = {};

        return _scoreMats(p, pool, exIds);

    function startAdd() { setEdit({ _i: -1, pn: "", nm: "", cust: "", mdl: "", typ: "", sz: "", vnd: "", cat: "CU" }); }

        // ไม่งั้นจะได้ค่าอย่าง "KENMAX\t" ซึ่งหน้าตาเหมือน "KENMAX" แต่เป็นคนละค่า
        const T = v => String(v == null ? "" : v).replace(/[\s ]+/g, " ").trim();
        const pnT = T(edit.pn);
        if (!pnT) { toast("กรุณากรอก Part No.", "err"); return; }
        const isNew = edit._i === -1;
        const dup = list.find(p => p._i !== edit._i && T(p.pn).toLowerCase() === pnT.toLowerCase() && T(p.sz).toLowerCase() === T(edit.sz).toLowerCase());
        if (dup) { toast(`⚠️ Part No. "${pnT}" (size เดียวกัน) มีอยู่แล้ว`, "err"); return; }
        // กันเคสพิมพ์/วางชื่อพาร์ทปนไว้ในช่อง Size โดยไม่ตั้งใจ (เช่น "Copper Ring 1.6x6.9") ซึ่งทำให้จับคู่กับคลังไม่ได้เลย
        let cleanSz = T(edit.sz);
        const nmT = T(edit.nm);
        if (nmT && cleanSz && cleanSz.toLowerCase().indexOf(nmT.toLowerCase()) === 0) {
            const stripped = cleanSz.slice(nmT.length).replace(/^[\s:.\-]+/, "");
            if (stripped) cleanSz = stripped;
        }
        const clean = { pn: pnT, nm: nmT, cust: T(edit.cust), mdl: T(edit.mdl) || pnT, typ: T(edit.typ), sz: cleanSz, vnd: T(edit.vnd), cat: T(edit.cat) || "CU" };

            // เพราะลำดับอาจเลื่อนถ้าข้อมูลถูกอัปเดตระหว่างเปิดฟอร์มอยู่ → เดิมจะไปเขียนทับรายการอื่น
            const origPn = T(edit.pn0 != null ? edit.pn0 : edit.pn).toLowerCase();

            (partDb || []).forEach((p, i) => {
                if (hit >= 0) return;
                if (T(p.pn).toLowerCase() === origPn && T(p.sz).toLowerCase() === origSz) hit = i;
